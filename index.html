<head>

  <title>My Daily Planner - Wujudkan Hari yang Lebih Teratur dan Bermakna. -</title> 

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Mengunci scroll pada pembungkus luar */
      background-color: #0d1117; 
      /* Solusi Safari Mobile iOS */
      -webkit-overflow-scrolling: touch; 
    }
    
    iframe {
      border: none;
      width: 100%;
      /* Menggunakan 100dvh (Dynamic Viewport Height) agar tinggi iframe */
      /* otomatis mengecil saat address bar HP muncul, sehingga navbar bawah tidak tenggelam */
      height: 100dvh; 
      display: block;
    }
  </style>
</head>
